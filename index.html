<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정비 이월 전송 시스템</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --border: #ced4da; --bg: #f4f7f6; --warning: #e67e22; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        
        .main-container { width: 100%; max-width: 1400px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); position: relative; }
        
        .header { border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; color: var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .header h2 { margin: 0; display: flex; align-items: baseline; }
        
        .user-display { font-size: 13px; color: #95a5a6; font-weight: normal; cursor: pointer; margin-left: 10px; transition: 0.2s; }
        .user-display:hover { color: var(--secondary); text-decoration: underline; }

        .top-section { display: flex; gap: 25px; margin-bottom: 20px; align-items: stretch; }
        .left-panel { flex: 1.3; display: flex; flex-direction: column; gap: 15px; min-width: 0; }
        
        .static-fields { display: flex; flex-wrap: nowrap; width: 100%; gap: 15px; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid var(--border); box-sizing: border-box; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0; position: relative; }
        .input-group label { font-size: 12px; font-weight: bold; color: var(--primary); padding-left: 2px; }
        .input-group .box { display: flex; background: white; border: 1px solid var(--border); border-radius: 4px; overflow: visible; height: 38px; align-items: center; position: relative; }
        .input-group input { flex: 1; border: none; padding: 0 8px; outline: none; font-size: 13px; height: 100%; background: transparent; min-width: 0; }
        
        .dropdown-list { 
            position: absolute; top: calc(100% + 2px); 
            background: white; border: 1px solid var(--primary); z-index: 9999; display: none; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.15); border-radius: 4px; 
        }
        .search-wrap .dropdown-list { width: max-content; max-width: 50vw; left: 0; right: auto; }
        .box .dropdown-list { min-width: 100%; width: max-content; left: 0; right: auto; }
        
        .dropdown-opt { 
            padding: 10px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #eee; 
            text-align: left; font-weight: bold; color: var(--primary); 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
            display: block; width: 100%; box-sizing: border-box;
        }
        .dropdown-opt:hover { background: var(--secondary); color: white; }
        .dropdown-opt.pinned { background: #e1f0fa; border-bottom: 2px solid var(--secondary); }
        .dropdown-opt.pinned:hover { background: #d0e7f9; color: var(--primary); }

        .prefix { background: #e9ecef; color: #495057; font-weight: bold; padding: 0 10px; font-size: 13px; border-right: 1px solid var(--border); height: 100%; display: flex; align-items: center; }
        .leg-box { padding: 0 5px; gap: 2px; justify-content: space-between; }
        .leg-box input { text-align: center; font-weight: bold; font-size: 11px; text-transform: uppercase; }

        .dynamic-container { border: 1px solid var(--border); border-radius: 8px; padding: 15px; background: white; flex: 1; min-width: 0; overflow: visible; }
        .dynamic-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; color: var(--primary); border-bottom: 2px solid var(--border); padding-bottom: 10px;}
        .btn-add { background: var(--secondary); color: white; border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        
        .defect-grid { display: grid; grid-template-columns: 85px minmax(130px, 1.8fr) minmax(210px, 2.3fr) minmax(70px, 1fr) 30px; gap: 8px; align-items: start; }
        .defect-header-row { margin-bottom: 8px; padding-bottom: 5px; border-bottom: 2px solid var(--border); }
        .defect-header-row span { font-size: 11px; font-weight: bold; color: #7f8c8d; text-align: center; }
        .defect-row { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed var(--border); }
        .defect-row:last-child { border-bottom: none; }
        
        .as-ap-wrapper { display: flex; align-items: center; gap: 6px; height: 38px; min-width: 0; }
        .idx-num { font-weight: bold; color: var(--secondary); font-size: 14px; width: 15px; text-align: right; }
        .toggle-box { display: flex; border: 1px solid var(--primary); border-radius: 4px; overflow: hidden; height: 100%; flex: 1; min-width: 0; }
        .toggle-btn { flex: 1; background: white; color: var(--primary); border: none; font-weight: bold; font-size: 11px; cursor: pointer; }
        .toggle-btn.active { background: var(--primary); color: white; }

        .doc-toggle-box { display: flex; border: 1px solid var(--primary); border-radius: 4px; height: 100%; width: 105px; flex-shrink: 0; position: relative; background: white;}
        .doc-toggle-btn { flex: 1; background: transparent; color: var(--primary); border: none; font-weight: bold; font-size: 10px; cursor: pointer; padding: 0; transition: 0.2s; }
        .doc-toggle-btn:not(:last-child) { border-right: 1px solid var(--border); }
        .doc-toggle-btn.active { background: var(--primary); color: white; }
        
        .etc-dropdown { min-width: 60px; left: auto; right: 0; text-align: center; border-radius: 4px; padding: 0; overflow: hidden !important; }
        .etc-dropdown .dropdown-opt { width: 100%; margin: 0; padding: 8px 0; font-size: 11px; text-align: center; border: none; border-bottom: 1px solid #eee; box-sizing: border-box; }
        .etc-dropdown .dropdown-opt:last-child { border-bottom: none; }

        .search-wrap { display: flex; border: 1px solid var(--border); border-radius: 4px; position: relative; overflow: visible; height: 38px; background: white; min-width: 0; width: 100%; }
        .search-wrap input { flex: 1; border: none; padding: 0 8px; outline: none; font-size: 13px; min-width: 0; border-radius: 4px 0 0 4px; }
        .search-wrap button { background: #34495e; color: white; border: none; width: 32px; flex-shrink: 0; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: 0.2s; border-radius: 0 4px 4px 0; position: relative; z-index: 10; }
        .search-wrap button:hover { background: #2c3e50; }

        .defect-row textarea { width: 100%; border: 1px solid var(--border); border-radius: 4px; padding: 8px; box-sizing: border-box; font-size: 13px; min-height: 38px; resize: none; overflow: hidden; line-height: 1.4; font-family: inherit; } 
        
        .btn-remove { background: #e74c3c; color: white; border: none; border-radius: 4px; height: 38px; width: 30px; flex-shrink: 0; font-weight: bold; cursor: pointer; transition: 0.2s; padding: 0; }
        .btn-remove:hover { background: #c0392b; }

        .right-panel { flex: 0.7; display: flex; flex-direction: column; gap: 15px; position: relative; min-width: 0; }
        #pasteArea { flex: 1; border: 2px dashed #bdc3c7; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #fafbfc; min-height: 350px; position: relative; text-align: center; overflow: hidden; }
        #pasteArea img { max-width: 95%; max-height: 330px; object-fit: contain; cursor: grab; }
        
        .drag-over { background: #e1f0fa !important; border-color: var(--secondary) !important; border-style: solid !important; }
        
        .upload-prompt { cursor: pointer; padding: 20px; transition: 0.2s; color: var(--primary); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; font-weight: bold; box-sizing: border-box; }
        .upload-prompt:hover { background: #e9ecef; border-radius: 8px; }

        .top-section.expanded .left-panel { flex: 1; }
        .top-section.expanded .right-panel { flex: 1.3; } 
        .top-section.expanded .static-fields { flex-wrap: wrap; }
        .top-section.expanded .static-fields .input-group { flex: 1 1 45%; } 
        .top-section.expanded .defect-grid { grid-template-columns: 80px minmax(0, 1.2fr) minmax(0, 1.8fr) minmax(0, 0.8fr) 30px; gap: 6px; } 
        .top-section.expanded .doc-toggle-box { width: 85px; }
        .top-section.expanded .doc-toggle-btn { font-size: 9px; padding: 0; }
        .top-section.expanded #pasteArea { height: 60vh; min-height: 350px; max-height: calc(100vh - 280px); } 
        .text-extract-mode #pasteArea { min-height: 200px; flex: none; }
        .text-extract-mode #pasteArea img { max-height: 180px; }

        .img-tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; z-index: 10; }
        .btn-tool { background: #34495e; color: white; border: none; width: 35px; height: 35px; border-radius: 6px; font-weight: bold; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn-tool:hover { background: var(--secondary); }
        .btn-tool.btn-close { background: #e74c3c; }
        .action-buttons { display: flex; gap: 10px; flex-shrink: 0; height: 50px; }
        .btn-extract { color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; padding: 0; height: 100%; }
        .btn-extract.main { flex: 2; background: #27ae60; }
        .btn-extract.sub { flex: 1; background: #8e44ad; }
        #rawTextArea { display: none; width: 100%; height: 180px; padding: 10px; box-sizing: border-box; border: 1px solid var(--primary); border-radius: 8px; font-family: inherit; font-size: 13px; line-height: 1.5; resize: vertical; background: #fdfefe; }

        .bottom-section { display: flex; gap: 10px; margin-top: 15px; padding-bottom: 5px; flex-shrink: 0; }
        .btn-mail { flex: 1; color: white; border: none; padding: 12px 5px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .bg-occ { background: #2980b9; } .bg-icn { background: #16a085; } .bg-gmp { background: #8e44ad; } .bg-duty { background: #e67e22; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-content h3 { margin-top: 0; color: var(--primary); border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 20px;}
        .modal-content label { font-size: 12px; font-weight: bold; color: var(--primary); display: block; margin-bottom: 5px; }
        .modal-content input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 20px; font-size: 14px; text-transform: uppercase; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-btns button { padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.2s;}
        .btn-cancel { background: #e9ecef; color: #495057; }
        .btn-cancel:hover { background: #ced4da; }
        .btn-save { background: var(--secondary); color: white; }
        .btn-save:hover { background: #2980b9; }

        .full-list-modal-content { background: white; padding: 25px; border-radius: 12px; width: 800px; max-width: 95vw; height: 85vh; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; flex-direction: column; }
        .full-list-modal-content h3 { margin-top: 0; color: var(--primary); border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 15px;}
        .full-list-container { flex: 1; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 5px; margin-bottom: 15px; background: #fdfefe; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header">
        <h2>✈️ 정비 이월 전송 시스템 <span id="userNameDisplay" class="user-display" onclick="changeUserName()"></span></h2>
    </div>
    <div class="top-section" id="mainTopSection">
        <div class="left-panel">
            <div class="static-fields">
                <div class="input-group"><label>기번 / 기종</label><div class="box"><span class="prefix">HL</span><input type="text" id="regNo" oninput="fillAcType()"><input type="text" id="acType" readonly placeholder="기종" style="width: 55px; background: #e9ecef; text-align: center; border-left: 1px solid var(--border); font-weight: bold; color: #495057;"></div></div>
                <div class="input-group"><label>편명</label><div class="box"><span class="prefix">OZ</span><input type="text" id="flightNo" oninput="matchLegsFromFlight()"><div id="flightOptions" class="dropdown-list" style="display:none;"></div></div></div>
                <div class="input-group"><label>구간</label><div class="box leg-box"><input type="text" id="legFrom" maxlength="3" placeholder="FROM" oninput="matchFlightFromLegs()"><button type="button" style="background:none; border:none; cursor:pointer;" onclick="swapLegs()">⇄</button><input type="text" id="legTo" maxlength="3" placeholder="TO" oninput="matchFlightFromLegs()"><div id="legOptions" class="dropdown-list" style="display:none;"></div></div></div>
                <div class="input-group"><label>위탁</label><div class="box" style="justify-content:center; cursor:pointer;" onclick="document.getElementById('handover').click();"><input type="checkbox" id="handover" onclick="event.stopPropagation();"></div></div>
            </div>
            <div class="dynamic-container">
                <div class="dynamic-header"><span ondblclick="openLearningModal()" style="cursor:help;">결함 및 조치내역</span><button type="button" class="btn-add" onclick="addRow()">+</button></div>
                <div class="defect-grid defect-header-row"><span>AS/AP</span><span>DEFECT</span><span>적용근거</span><span>ATA</span><span>삭제</span></div>
                <div id="defectRowsContainer"></div>
            </div>
        </div>
        <div class="right-panel" id="rightPanel">
            <input type="file" id="imageFileInput" style="position: absolute; width: 1px; height: 1px; opacity: 0; z-index: -1;" accept="image/*" onchange="handleImageFile(event)">
            <div id="pasteArea">
                <div class="upload-prompt" onclick="document.getElementById('imageFileInput').click()">
                    <div style="font-size: 40px; margin-bottom: 10px;">📸</div>이곳을 터치하여 사진 첨부
                </div>
            </div>
            <textarea id="rawTextArea" placeholder="추출된 텍스트가 이곳에 표시됩니다..."></textarea>
            <div class="action-buttons">
                <button type="button" class="btn-extract main" id="btnExtractMain" onclick="extractText()">✨ AI 분석 및 자동 매칭</button>
                <button type="button" class="btn-extract sub" id="btnExtractRaw" onclick="extractRawText()">📝 TEXT 추출</button>
            </div>
        </div>
    </div>
    <div class="bottom-section">
        <button type="button" class="btn-mail bg-occ" id="btn-occ" onclick="sendWebhook('OCC')">OCC 전송 (F8)</button>
        <button type="button" class="btn-mail bg-icn" id="btn-icn" onclick="sendEmailViaMailto('ICN')">ICN 전송</button>
        <button type="button" class="btn-mail bg-gmp" id="btn-gmp" onclick="sendEmailViaMailto('GMP')">GMP 전송</button>
        <button type="button" class="btn-mail bg-duty" id="btn-duty" onclick="sendWebhook('DUTY')">DUTY 전송 (F9)</button>
    </div>
</div>

<div id="learningModal" class="modal-overlay">
    <div class="modal-content">
        <h3>🤖 AI 오답 교정 학습</h3>
        <label>오답</label><input type="text" id="wrongWord">
        <label>정답</label><input type="text" id="rightWord">
        <div class="modal-btns"><button type="button" class="btn-cancel" onclick="closeLearningModal()">취소</button><button type="button" class="btn-save" onclick="saveLearning()">저장</button></div>
    </div>
</div>

<div id="fullListModal" class="modal-overlay" style="z-index: 10001;">
    <div class="full-list-modal-content">
        <h3 id="fullListTitle">전체 리스트 열람</h3>
        <div class="search-wrap" style="margin-bottom: 10px; height: 45px;"><input type="text" id="fullListSearch" oninput="filterFullList()"></div>
        <div id="fullListContainer" class="full-list-container"></div>
        <div class="modal-btns"><button type="button" class="btn-cancel" onclick="closeFullListModal()">닫기</button></div>
    </div>
</div>

<script>
    const WEBHOOK_URLS = {
        "OCC": "https://chat.googleapis.com/v1/spaces/AAQAkm9cIHk/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=DHRSasF0dZDVUu2cb2QUqM5RNjQOD3Q5BIpWOBEjJro",
        "DUTY": "https://chat.googleapis.com/v1/spaces/AAQAyIkJVWM/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=vrARRhME-upDKnSnLiWZ2qnycamT6XyxhaSSZH8vOXg"
    };
    let fileToUpload = null; let rowIdCounter = 0; let DB = { flights: [], ataDatabase: [], actionDatabase: [], ac: {}, emails: {} };
    let currentRotation = 0, currentScale = 1, translateX = 0, translateY = 0, isDragging = false, currentAbortController = null;
    let currentFullList = [], currentTargetInputId = '', currentTargetRowId = '', currentSearchType = '';

    document.addEventListener('keydown', (e) => {
        if (currentAbortController) return;
        if (e.key === 'F8') { e.preventDefault(); sendWebhook('OCC'); }
        if (e.key === 'F9') { e.preventDefault(); sendWebhook('DUTY'); }
        if (!['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
            if (e.key === 'Enter' && fileToUpload) extractText();
            if (e.key === 'ArrowLeft') rotateLeft(null);
            if (e.key === 'ArrowRight') rotateRight(null);
        }
    });

    function openLearningModal() { document.getElementById('learningModal').style.display = 'flex'; document.getElementById('wrongWord').focus(); }
    function closeLearningModal() { document.getElementById('learningModal').style.display = 'none'; document.getElementById('wrongWord').value = ''; document.getElementById('rightWord').value = ''; }
    async function saveLearning() {
        const wrong = document.getElementById('wrongWord').value.trim(); const right = document.getElementById('rightWord').value.trim();
        if(!wrong || !right) return alert("값을 입력하세요.");
        try { await fetch('/save_learning', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({wrong, right}) }); alert("저장 완료"); closeLearningModal(); } catch (err) { alert(err.message); }
    }

    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image(); img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas'); let w = img.width, h = img.height;
                    let deg = (currentRotation % 360 + 360) % 360; let isV = (deg === 90 || deg === 270);
                    let tw = isV ? h : w, th = isV ? w : h;
                    if (tw > 1200) { th *= 1200 / tw; tw = 1200; } if (th > 1200) { tw *= 1200 / th; th = 1200; }
                    canvas.width = tw; canvas.height = th; const ctx = canvas.getContext('2d');
                    ctx.translate(tw / 2, th / 2); ctx.rotate(deg * Math.PI / 180);
                    ctx.drawImage(img, -(isV ? th : tw) / 2, -(isV ? tw : th) / 2, isV ? th : tw, isV ? tw : th);
                    canvas.toBlob((b) => resolve(new File([b], file.name, { type: 'image/jpeg' })), 'image/jpeg', 0.7);
                };
            };
        });
    }

    async function loadDB() {
        try {
            const res = await fetch("/api/db"); const data = await res.json();
            if (data && Object.keys(data.ac).length > 0) { DB = data; DB.ataDatabase?.forEach(d => d.searchTarget = (d.keyword + " " + d.code).toLowerCase()); DB.actionDatabase?.forEach(d => d.searchTarget = (d.keyword + " " + d.code).toLowerCase()); }
        } catch (e) { console.error(e); }
    }
    
    function fillAcType() { 
        let rNo = document.getElementById('regNo').value.toUpperCase().trim().replace(/^HL/, ""); 
        document.getElementById('acType').value = DB.ac[rNo] || DB.ac["HL" + rNo] || ""; 
    }
    
    function updateUserNameDisplay() { let name = localStorage.getItem('logScanner_userName'); document.getElementById('userNameDisplay').innerText = name ? `(USER : ${name})` : `(USER : 미설정)`; }
    
    function changeUserName() { let name = prompt("성함을 입력하세요:", localStorage.getItem('logScanner_userName') || ""); if (name) { localStorage.setItem('logScanner_userName', name.trim()); updateUserNameDisplay(); } }

    function addRow(data = {}) {
        rowIdCounter++; const id = rowIdCounter; const container = document.getElementById('defectRowsContainer');
        const row = document.createElement('div'); row.className = 'defect-grid defect-row'; row.id = `row-${id}`;
        const asApVal = (data.asAp === 'AP' || data.asAp === 'AS') ? data.asAp : '';
        let pType = "", pCode = data.reason || "";
        if (pCode) { const m = pCode.match(/^(MEL|NEF|CDL|AMM|SRM)\s*(.*)/i); if (m) { pType = m[1].toUpperCase(); pCode = m[2].trim(); } }
        
        row.innerHTML = `
            <div class="as-ap-wrapper"><span class="idx-num"></span><div class="toggle-box"><button type="button" class="toggle-btn ${asApVal==='AS'?'active':''}" onclick="setAsAp(${id},'AS')">AS</button><button type="button" class="toggle-btn ${asApVal==='AP'?'active':''}" onclick="setAsAp(${id},'AP')">AP</button></div><input type="hidden" id="asAp-${id}" value="${asApVal}"></div>
            <div><textarea id="defect-${id}" rows="1" oninput="autoResize(this);">${data.defect || ''}</textarea></div>
            <div style="display:flex; gap:4px; height:38px;"><div class="doc-toggle-box" id="doc-toggle-box-${id}"><button type="button" class="doc-toggle-btn" id="btn-mel-${id}" onclick="setDocType(${id},'MEL')">MEL</button><button type="button" class="doc-toggle-btn" id="btn-nef-${id}" onclick="setDocType(${id},'NEF')">NEF</button><button type="button" class="doc-toggle-btn" id="btn-etc-${id}" onclick="toggleEtcDropdown(${id})">ETC</button><div id="dropdown-etc-${id}" class="dropdown-list etc-dropdown"><div class="dropdown-opt" onclick="setDocType(${id},'CDL')">CDL</div><div class="dropdown-opt" onclick="setDocType(${id},'AMM')">AMM</div><div class="dropdown-opt" onclick="setDocType(${id},'SRM')">SRM</div></div></div><div class="search-wrap"><input type="text" id="reason-${id}" value="${pCode}"><button type="button" id="btn-search-reason-${id}" onclick="searchSmartDB(${id},'ACTION')">🔍</button><div id="dropdown-ACTION-${id}" class="dropdown-list"></div></div><input type="hidden" id="docType-${id}" value="${pType}"></div>

    function getSmartNefPhrases() {
        if (!DB.actionDatabase || DB.actionDatabase.length === 0) return [];
        let sIdx = DB.actionDatabase.findIndex(d => d.type === 'NEF' && d.code === '99-00-00' && d.keyword.includes('GENERAL'));
        let eIdx = DB.actionDatabase.findIndex(d => d.type === 'NEF' && d.code === '33-00-12' && d.keyword.includes('SERVICE AREA/BAYS - AIR CONDITIONING SVC BAYS - INDICATION LIGHT LENSES CRACKED'));

        if (sIdx !== -1 && eIdx !== -1) {
            if (sIdx > eIdx) { let t = sIdx; sIdx = eIdx; eIdx = t; }
            return DB.actionDatabase.slice(sIdx, eIdx + 1);
        }
        return DB.actionDatabase.filter(d => d.type === 'NEF');
    }

    function getSmartMelPhrases(acType) {
        if (!DB.actionDatabase || DB.actionDatabase.length === 0) return [];
        let sAc = acType.toUpperCase(); 
        if (sAc.includes("A321")||sAc.includes("A32N")) sAc = "A321"; 
        else if (sAc.includes("A330")) sAc = "A330"; 
        else if (sAc.includes("A350")) sAc = "A350"; 
        else if (sAc.includes("A380")) sAc = "A380";
        else if (sAc.includes("B777") || sAc.includes("777")) sAc = "B777";

        let startCode = '', endCode = '', startStr = '', endStr = '';
        
        if (sAc === "A321") {
            startCode = "21-00-04A"; startStr = "TEMP CTL 1(2) MAINTENANCE MESSAGE - MAY BE DISPLAYED ON THE STATUS SD PAGE";
            endCode = "80-12-01A"; endStr = "FAULT LIGHT ON THE ENG MASTER PANEL - ONE OR BOTH MAY BE INOPERATIVE";
        }
        else if (sAc === "A330") {
            startCode = "21-01-01-01A"; startStr = "PACK 1(2) PB-SW FAULT LIGHT - ONE OR BOTH MAY BE INOPERATIVE";
            endCode = "80-12-01A"; endStr = "FAULT LIGHT ON ENG MASTER PANEL - ONE OR BOTH MAY BE INOPERATIVE";
        }
        else if (sAc === "A350") {
            startCode = "21-01-01A"; startStr = "PACK 1(2) PB-SW FAULT LIGHT";
            endCode = "80-12-01A"; endStr = "FAULT LIGHT ON ENGINE MASTER LEVER - ONE OR BOTH MAY BE INOPERATIVE";
        }
        else if (sAc === "A380") {
            startCode = "21-01-01A"; startStr = "PACK PB-SW FAULT LIGHT";
            endCode = "80-11-02A"; endStr = "ENGINE MANUAL START SYSTEM";
        }
        else if (sAc === "B777") {
            startCode = "21-00-01-01"; startStr = "ENVIRONMENTAL CONTROL SYSTEM MISCELLANEOUS CARDS (ECSMC) - PASSENGER";
            endCode = "80-11-03"; endStr = "START SWITCH HOLDING/CUTOUT SYSTEMS";
        }
        else {
            return DB.actionDatabase.filter(d => d.type === 'MEL' && (d.acType === sAc || d.acType === 'ALL') && isNotJunk(d));
        }

        let sIdx = DB.actionDatabase.findIndex(d => d.type === 'MEL' && d.acType.includes(sAc) && d.code === startCode && d.keyword.includes(startStr));
        let eIdx = DB.actionDatabase.findIndex(d => d.type === 'MEL' && d.acType.includes(sAc) && d.code === endCode && d.keyword.includes(endStr));

        if (sIdx !== -1 && eIdx !== -1) {
            if (sIdx > eIdx) { let t = sIdx; sIdx = eIdx; eIdx = t; }
            return DB.actionDatabase.slice(sIdx, eIdx + 1).filter(d => d.type === 'MEL' && (d.acType.includes(sAc) || d.acType === 'ALL') && isNotJunk(d));
        }

        return DB.actionDatabase.filter(d => d.type === 'MEL' && (d.acType.includes(sAc) || d.acType === 'ALL') && isNotJunk(d));
    }

    }

            const docT = document.getElementById(`docType-${id}`).value.toUpperCase();
            if (docT === 'NEF') { titleEl.innerText = "[NEF] 전체 대표 리스트"; dbToSearch = getSmartNefPhrases(); } 
            else if (docT === 'MEL') { titleEl.innerText = `[MEL] 전체 리스트 (${sAc})`; dbToSearch = getSmartMelPhrases(sAc); } 
            else dbToSearch = DB.actionDatabase.filter(d => d.type === docT && (d.acType === 'ALL' || sAc.includes(d.acType)));
        }
        let seen = new Set(); currentFullList = [];
        dbToSearch.forEach(item => { const cb = searchType==='ATA'?item.code.replace(/[^0-9A-Z]/gi,'').substring(0,4):item.code.replace(/[^0-9A-Z]/gi,''); if(!seen.has(cb+item.type)){ seen.add(cb+item.type); currentFullList.push(item); } });
        if (searchType !== 'ATA' && document.getElementById(`docType-${id}`).value.toUpperCase() === 'NEF') {} else { currentFullList.sort((a,b) => a.code.localeCompare(b.code)); }
        document.getElementById('fullListSearch').value = ''; renderFullList(currentFullList); document.getElementById('fullListModal').style.display = 'flex';
        setTimeout(() => document.getElementById('fullListSearch').focus(), 100);
    }

    function renderFullList(list) {
        const container = document.getElementById('fullListContainer'); container.innerHTML = '';
        if(list.length === 0) { container.innerHTML = `<div style="padding:20px; text-align:center; color:#7f8c8d;">데이터가 없습니다.</div>`; return; }
        list.forEach(item => {
            const px = currentSearchType!=='ATA'&&item.type?item.type+' ':''; const fDisp = currentSearchType!=='ATA'?`${px}${item.code}`.trim():item.code;
            const div = document.createElement('div'); div.className = 'dropdown-opt'; div.innerHTML = `<b>${fDisp}</b> :: ${item.keyword}`;
            div.onclick = () => { if (currentSearchType!=='ATA'){const m=fDisp.match(/^(MEL|NEF|CDL|AMM|SRM)\s*(.*)/i); if(m){setDocType(currentTargetRowId,m[1].toUpperCase()); document.getElementById(currentTargetInputId).value=m[2].trim();}else document.getElementById(currentTargetInputId).value=fDisp;}else document.getElementById(currentTargetInputId).value=fDisp; closeFullListModal(); };
            container.appendChild(div);
        });
    }

    function filterFullList() { const kw = document.getElementById('fullListSearch').value.toUpperCase().replace(/\s+/g,''); if(!kw){renderFullList(currentFullList); return;} renderFullList(currentFullList.filter(item => (item.code+item.keyword).toUpperCase().replace(/\s+/g,'').includes(kw))); }
    function closeFullListModal() { document.getElementById('fullListModal').style.display = 'none'; }
    function matchFlightFromLegs() { /* 상단에 생략된 동일 명칭의 원본 로직 작동 */ matchFlightFromLegs_origin(); }
    function matchLegsFromFlight() { /* 상단에 생략된 동일 명칭의 원본 로직 작동 */ matchLegsFromFlight_origin(); }
    function swapLegs() { const f = document.getElementById('legFrom'), t = document.getElementById('legTo'), tmp = f.value; f.value = t.value; t.value = tmp; document.getElementById('flightNo').value = ""; matchFlightFromLegs(); }
    function removeDefectRow(btn) { if(document.querySelectorAll('.defect-row').length > 1) { btn.parentElement.remove(); updateNums(); } }
    function updateNums() { document.querySelectorAll('.idx-num').forEach((el, i) => el.innerText = (i + 1) + '.'); }
    function setAsAp(id, type) { const r = document.getElementById('row-'+id); r.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); document.getElementById(`asAp-${id}`).value = type; }
    function toggleEtcDropdown(id) { const d = document.getElementById(`dropdown-etc-${id}`); d.style.display = d.style.display === 'block' ? 'none' : 'block'; }
    function applyTransform() { const img = document.getElementById('pastedImg'); if (img) img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale}) rotate(${currentRotation}deg)`; }
    function rotateLeft(e) { if(e) e.stopPropagation(); currentRotation -= 90; applyTransform(); }
    function rotateRight(e) { if(e) e.stopPropagation(); currentRotation += 90; applyTransform(); }
    function toggleExpand() { document.getElementById('mainTopSection').classList.toggle('expanded'); translateX = 0; translateY = 0; currentScale = 1; applyTransform(); setTimeout(refreshAllHeights, 150); }
    function loadAndDisplayImage(file) { fileToUpload = file; const url = URL.createObjectURL(fileToUpload); document.getElementById('mainTopSection').classList.remove('expanded'); document.getElementById('rightPanel').classList.remove('text-extract-mode'); document.getElementById('rawTextArea').style.display = 'none'; document.getElementById('pasteArea').innerHTML = `<div class="img-tools"><button type="button" class="btn-tool" onclick="document.getElementById('imageFileInput').click()">📸</button><button type="button" class="btn-tool btn-rotate-left" onclick="rotateLeft(event)"></button><button type="button" class="btn-tool btn-rotate-right" onclick="rotateRight(event)"></button><button type="button" class="btn-tool btn-close" onclick="resetImage(event)">✖</button></div><img src="${url}" id="pastedImg" draggable="false">`; setTimeout(refreshAllHeights, 50); }
    function resetImage(e) { if(e) e.stopPropagation(); if(currentAbortController) currentAbortController.abort(); fileToUpload = null; document.getElementById('imageFileInput').value = ""; document.getElementById('mainTopSection').classList.remove('expanded'); document.getElementById('pasteArea').innerHTML = `<div class="upload-prompt" onclick="document.getElementById('imageFileInput').click()"><div style="font-size: 40px; margin-bottom: 10px;">📸</div>이곳을 터치하여 사진 첨부</div>`; document.getElementById('defectRowsContainer').innerHTML = ""; rowIdCounter = 0; addRow(); setTimeout(refreshAllHeights, 50); }
    function handleImageFile(event) { const file = event.target.files[0]; if (file) loadAndDisplayImage(file); event.target.value = ""; }

    function matchFlightFromLegs_origin() { const f = document.getElementById('legFrom').value.toUpperCase(), t = document.getElementById('legTo').value.toUpperCase(), input = document.getElementById('flightNo'), opt = document.getElementById('flightOptions'); opt.innerHTML = ""; opt.style.display = "none"; input.value = input.value.replace(/^OZ/i, '').replace(/^0+/, ''); if (f.length === 3 && t.length === 3 && DB.flights.length > 0) { const m = DB.flights.filter(item => item.from === f && item.to === t); if (m.length === 1) input.value = String(m[0].no).replace(/^0+/, ''); else if (m.length > 1) { opt.style.display = "block"; m.forEach(item => { const r = document.createElement('div'); r.className = 'dropdown-opt'; r.innerText = `OZ${String(item.no).replace(/^0+/,'')}`; r.onmousedown = () => { input.value = String(item.no).replace(/^0+/,''); opt.style.display = "none"; }; opt.appendChild(r); }); } } }
    function matchLegsFromFlight_origin() { const input = document.getElementById('flightNo'); input.value = input.value.replace(/^OZ/i, '').replace(/^0+/, ''); const fNo = input.value.trim(), opt = document.getElementById('legOptions'); opt.innerHTML = ""; opt.style.display = "none"; if (fNo && DB.flights.length > 0) { const m = DB.flights.filter(item => String(item.no).replace(/^0+/, '') === fNo); if (m.length === 1) { document.getElementById('legFrom').value = m[0].from; document.getElementById('legTo').value = m[0].to; } else if (m.length > 1) { opt.style.display = "block"; m.forEach(item => { const r = document.createElement('div'); r.className = 'dropdown-opt'; r.innerText = `${item.from} ➔ ${item.to}`; r.onmousedown = () => { document.getElementById('legFrom').value = item.from; document.getElementById('legTo').value = item.to; opt.style.display = "none"; }; opt.appendChild(r); }); } } }

    window.onload = async () => {
        addRow(); await loadDB(); updateUserNameDisplay();
        window.addEventListener('mousedown', (e) => { if (e.target.closest('#fullListModal')) return; if (!e.target.closest('.input-group') && !e.target.closest('.search-wrap') && !e.target.closest('.doc-toggle-box')) { document.querySelectorAll('.dropdown-list').forEach(el => el.style.display = "none"); } });
        const p = document.getElementById('pasteArea');
        p.addEventListener('dragover', (e) => { e.preventDefault(); p.classList.add('drag-over'); }); p.addEventListener('dragleave', (e) => { e.preventDefault(); p.classList.remove('drag-over'); });
        p.addEventListener('drop', (e) => { e.preventDefault(); p.classList.remove('drag-over'); if (e.dataTransfer.files?.length > 0) { const file = e.dataTransfer.files[0]; if (file.type.startsWith('image/')) loadAndDisplayImage(file); } });
        p.addEventListener('wheel', (e) => { if (!document.getElementById('pastedImg')) return; e.preventDefault(); currentScale += e.deltaY < 0 ? 0.15 : -0.15; currentScale = Math.max(0.2, Math.min(currentScale, 6)); applyTransform(); });
        p.addEventListener('mousedown', (e) => { if (!document.getElementById('pastedImg') || e.target.closest('.img-tools')) return; e.preventDefault(); isDragging = true; clickStartX = e.clientX; clickStartY = e.clientY; startDragX = e.clientX - translateX; startDragY = e.clientY - translateY; });
        window.addEventListener('mousemove', (e) => { if (!isDragging) return; translateX = e.clientX - startDragX; translateY = e.clientY - startDragY; applyTransform(); });
        window.addEventListener('mouseup', (e) => { if (isDragging && Math.abs(e.clientX - clickStartX) < 5 && Math.abs(e.clientY - clickStartY) < 5 && e.target.id === 'pastedImg') toggleExpand(); isDragging = false; });
        window.addEventListener('paste', (e) => { if (!e.clipboardData) return; const items = e.clipboardData.items; for (let i=0; i<items.length; i++) { if (items[i].type.indexOf("image") !== -1) { e.preventDefault(); const file = items[i].getAsFile(); if (file) loadAndDisplayImage(file); return; } } });
    };

    async function extractText() {
        if (!fileToUpload) return alert("사진을 첨부하세요!"); const btn = document.getElementById('btnExtractMain'); btn.innerText = "분석 중... ⏳"; btn.disabled = true;
        if (currentAbortController) currentAbortController.abort(); currentAbortController = new AbortController();
        const cf = await compressImage(fileToUpload); const fd = new FormData(); fd.append("file", cf);
        try {
            const res = await fetch("/ocr", { method: "POST", body: fd, signal: currentAbortController.signal }); const data = await res.json();
            if (data.error) return alert(data.error);
            if (data.regNo) { document.getElementById('regNo').value = String(data.regNo).replace(/[^0-9A-Z]/gi, '').replace(/^HL/i, ""); fillAcType(); }
            if (data.flightNo) document.getElementById('flightNo').value = String(data.flightNo).toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^OZ/i, '').replace(/^0+/, '');
            if (data.legFrom) document.getElementById('legFrom').value = String(data.legFrom).replace(/[^A-Z]/gi, '').toUpperCase();
            if (data.legTo) document.getElementById('legTo').value = String(data.legTo).replace(/[^A-Z]/gi, '').toUpperCase();
            if (data.flightNo && (!data.legFrom || !data.legTo)) matchLegsFromFlight(); else if (!data.flightNo && (data.legFrom && data.legTo)) matchFlightFromLegs();
            if (data.items?.length > 0) { document.getElementById('defectRowsContainer').innerHTML = ""; rowIdCounter = 0; data.items.forEach(item => addRow(item)); setTimeout(refreshAllHeights, 150); }
            else { alert("결함을 찾지 못했습니다."); if (document.querySelectorAll('.defect-row').length === 0) addRow(); }
        } catch (e) { if (e.name !== 'AbortError') alert(e.message); } finally { btn.innerText = "✨ AI 분석 및 자동 매칭"; btn.disabled = false; currentAbortController = null; }
    }

    async function extractRawText() {
        if (!fileToUpload) return alert("사진을 첨부하세요!"); const btn = document.getElementById('btnExtractRaw'); btn.innerText = "추출 중... ⏳"; btn.disabled = true;
        if (currentAbortController) currentAbortController.abort(); currentAbortController = new AbortController();
        const cf = await compressImage(fileToUpload); const fd = new FormData(); fd.append("file", cf);
        try {
            const res = await fetch("/extract_raw", { method: "POST", body: fd, signal: currentAbortController.signal }); const data = await res.json();
            if (data.error) return alert(data.error); document.getElementById('rightPanel').classList.add('text-extract-mode');
            const ta = document.getElementById('rawTextArea'); ta.style.display = 'block'; ta.value = data.text || "텍스트가 없습니다.";
        } catch (e) { if (e.name !== 'AbortError') alert(e.message); } finally { btn.innerText = "📝 TEXT 추출"; btn.disabled = false; currentAbortController = null; }
    }
</script>
</body>
